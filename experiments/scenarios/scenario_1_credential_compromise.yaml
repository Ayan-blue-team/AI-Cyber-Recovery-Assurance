# Scenario 1 — Credential Compromise
#
# Setup (run manually before this scenario, see docs/threat_model.md):
#   On WIN-01: a local account 'user123' with password 'Passw0rd123!' must
#   exist. Confirm the compromise precondition by running, from Kali:
#     nxc smb <WIN01_HOST> -u user123 -p 'Passw0rd123!'
#   and confirming it succeeds ([+]) before running this scenario.

name: scenario_1_credential_compromise
description: >
  A credential for the local account 'user123' has been compromised and
  used to authenticate over SMB from an external host (Kali). Tests
  whether disabling/rotating the account actually prevents reuse of the
  original credential.

incident:
  incident_id: INC-SCN1-YAML-001
  severity: high
  host: "${WIN01_HOST}"
  user: user123
  alert: "Compromised credential used for SMB authentication from an external host"
  telemetry_note: >
    A credential-reuse attempt against this host was manually confirmed
    via SMB authentication from an external attacker host prior to this
    run.

assurance:
  - name: AccountDisabledInvariant
    params:
      account: user123

re_attack:
  scenario_name: credential_reuse_attempt_smb
  executor: ssh
  host_ref: kali
  command: "nxc smb ${WIN01_HOST} -u user123 -p 'Passw0rd123!'"
  success_markers:
    - "[+]"
  failure_markers:
    - "[-]"
    - "STATUS_LOGON_FAILURE"
    - "STATUS_ACCOUNT_DISABLED"
